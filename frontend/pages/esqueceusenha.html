<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/esqueceusenha.css">
  <title>CodeWave - Recuperar senha</title>
</head>
<body>
  <div class="login-layout">
    <div class="login-left">
      <a href="../index.html" class="logo">
        <svg width="auto" height="18" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M55 20 L35 40 L55 60" />
            <path d="M70 40 C80 22, 96 22, 110 40 C124 58, 140 58, 150 40" />
            <path d="M165 20 L185 40 L165 60" />
          </g>
        </svg>
      </a>
      <div class="login-left-text">
        <h1>Recupere o acesso<br>e continue sua <span class="destaque-amarelo">jornada.</span></h1>
        <p class="login-left-desc">Digite seu e-mail e enviaremos um link<br>para você redefinir sua senha.</p>
      </div>
      <img src="../assets/image/cadastrologinimage.png" alt="Image" class="login-img">
    </div>

    <div class="login-right">
      <div class="login-form-wrapper">
        <a href="login.html" class="voltar-login">
          <i class="ph ph-caret-left"></i> Voltar para o login
        </a>

        <h2>Esqueceu sua senha?</h2>
        <p>Não se preocupe! Informe seu e-mail que enviaremos um link para redefinir sua senha.</p>

        <div class="form-group">
          <label>E-mail</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope input-icon"></i>
            <input type="email" placeholder="seu@email.com">
          </div>
        </div>

        <button class="btn-login">Enviar</button>
    </div>
  </div>

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>
</html>
